name: Build release asset

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Build clean plugin ZIP
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -eu
          mkdir -p dist
          git archive --format=tar --prefix=ship-scss-compiler/ "$RELEASE_TAG" | tar -x -C dist
          test -f dist/ship-scss-compiler/ship-scss-compiler.php
          (cd dist && zip -qr "../ship-scss-compiler-${RELEASE_TAG#v}.zip" ship-scss-compiler)

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" "ship-scss-compiler-${RELEASE_TAG#v}.zip" --clobber
